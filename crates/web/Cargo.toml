[package]
name = "dart-web"
description = "Mobile-first Leptos client for dart scoring."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
dart-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Document",
  "DomRect",
  "Element",
  "HtmlElement",
  "Navigator",
  "PointerEvent",
  "Storage",
  "VisibilityState",
  "Window",
] }
